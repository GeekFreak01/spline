<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spline</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/paper-core.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- ============ Menu bar ============ -->
  <header class="menubar">
    <img class="app-logo" src="favicon.svg" alt="Spline" width="18" height="18">
    <nav class="menus" id="menus" role="menubar" aria-label="Menu"></nav>
    <button class="doc-title" id="fontNameBtn" type="button" data-i18n-title="fontInfo">
      <span id="fontName"></span><span class="dirty-dot" id="dirtyDot" hidden></span>
    </button>
    <div class="view-switch" role="tablist" aria-label="View">
      <button type="button" role="tab" id="tabGlyphs" data-i18n="viewGlyphs"></button>
      <button type="button" role="tab" id="tabKerning" data-i18n="viewKerning"></button>
    </div>
    <div class="menubar-right">
      <button class="btn btn-primary" id="exportBtn" type="button"><i data-icon="download" data-size="15"></i><span data-i18n="export"></span></button>
    </div>
    <input type="file" id="fileInput" hidden>
  </header>

  <!-- ============ Options bar (context of the current tool/view) ============ -->
  <div class="optionsbar" id="optionsBar"></div>

  <main class="workspace" id="main">
    <!-- ============ Glyph overview ============ -->
    <section class="view view-grid" id="gridView">
      <aside class="panel side" aria-label="Filters">
        <div class="panel-head" data-i18n="categories"></div>
        <div class="panel-body">
          <nav class="cat-list" id="catList"></nav>
          <div class="sub-head" data-i18n="colors"></div>
          <div class="color-filter" id="colorFilter"></div>
          <div class="sub-head" data-i18n="progressTitle"></div>
          <div class="progress" id="progress">
            <div class="progress-bar"><div id="progressFill"></div></div>
            <div class="progress-label" id="progressLabel"></div>
          </div>
        </div>
        <div class="side-metrics" id="sideMetrics"></div>
      </aside>

      <div class="grid-wrap" id="gridWrap">
        <div class="glyph-grid" id="glyphGrid" role="listbox" aria-multiselectable="true" tabindex="0"></div>
      </div>

      <aside class="dock" id="inspector"></aside>
    </section>

    <!-- ============ Kerning ============ -->
    <section class="view view-kern" id="kernView" hidden>
      <div class="canvas-wrap"><canvas id="kernCanvas" tabindex="0" role="img" aria-label="Kerning"></canvas></div>
      <aside class="dock" id="kernPanel"></aside>
    </section>

    <!-- ============ Glyph editor ============ -->
    <section class="view view-editor" id="editorView" hidden>
      <nav class="toolstrip" id="toolbar" aria-label="Tools">
        <button class="tool" id="backBtn" type="button" data-i18n-title="back"><i data-icon="grid" data-size="18"></i></button>
        <div class="tool-sep"></div>
        <div id="toolButtons" role="radiogroup" aria-label="Tools"></div>
      </nav>

      <div class="canvas-wrap">
        <canvas id="canvas" tabindex="0" role="img"></canvas>
      </div>

      <aside class="dock" id="glyphPanel"></aside>
    </section>
  </main>

  <!-- ============ Preview ============ -->
  <section class="preview" id="preview" aria-labelledby="previewTitle">
    <div class="preview-head">
      <button class="collapse" id="previewToggle" type="button" aria-expanded="true" aria-controls="previewBody">
        <i data-icon="chevronDown" data-size="14"></i><span id="previewTitle" data-i18n="preview"></span>
      </button>
      <input id="previewInput" spellcheck="false" aria-labelledby="previewTitle">
      <label class="preview-size"><span data-i18n="previewSize"></span>
        <input type="range" id="previewSize" min="12" max="160" value="48"><output id="previewSizeOut">48</output>
      </label>
    </div>
    <div class="preview-body" id="previewBody">
      <div class="preview-out" id="previewOut"></div>
      <p class="preview-msg" id="previewMsg"></p>
    </div>
  </section>

  <!-- ============ Status bar ============ -->
  <footer class="statusbar">
    <span id="statusTip" aria-live="polite"></span>
    <span class="status-right">
      <span id="statusPos" class="mono"></span>
      <span id="statusZoom" class="mono"></span>
      <span id="statusInfo"></span>
    </span>
  </footer>

  <div class="drop-overlay" id="dropOverlay" hidden><div><i data-icon="open" data-size="40"></i><p data-i18n="dropHere"></p></div></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog class="dialog" id="dialog"></dialog>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
</body>
</html>
