<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spline</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/paper-core.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <!--site:head-->
</head>
<body>
  <!-- ============ Menu bar ============ -->
  <header class="menubar">
    <img class="app-logo" src="favicon.svg" alt="Spline" width="18" height="18">
    <nav class="menus" id="menus" role="menubar" aria-label="Menu"></nav>
    <button class="doc-title" id="fontNameBtn" type="button" data-i18n-title="fontInfo">
      <span id="fontName"></span><span class="dirty-dot" id="dirtyDot" hidden></span>
    </button>
    <div class="view-switch" role="tablist" aria-label="View">
      <button type="button" role="tab" id="tabGlyphs" data-i18n="viewGlyphs"></button>
      <button type="button" role="tab" id="tabKerning" data-i18n="viewKerning"></button>
    </div>
    <div class="menubar-right">
      <button class="btn btn-primary" id="exportBtn" type="button"><i data-icon="download" data-size="15"></i><span data-i18n="export"></span></button>
    </div>
    <!-- Window buttons: shown only inside the Spline app window -->
    <div class="win-controls" id="winControls" hidden>
      <button type="button" class="win-btn" data-win="minimize" data-i18n-title="winMinimize">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10" stroke="currentColor"/></svg>
      </button>
      <button type="button" class="win-btn" data-win="toggleMaximize" id="winMax" data-i18n-title="winMaximize">
        <svg class="i-max" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"/></svg>
        <svg class="i-restore" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5V0.5h7v7h-2M0.5 2.5h7v7h-7z" fill="none" stroke="currentColor"/></svg>
      </button>
      <button type="button" class="win-btn win-close" data-win="close" data-i18n-title="winClose">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" stroke="currentColor"/></svg>
      </button>
    </div>
    <input type="file" id="fileInput" hidden>
  </header>
  <div class="resize-edges" id="resizeEdges" hidden>
    <div data-edge="n"></div><div data-edge="s"></div><div data-edge="w"></div><div data-edge="e"></div>
    <div data-edge="nw"></div><div data-edge="ne"></div><div data-edge="sw"></div><div data-edge="se"></div>
  </div>

  <!-- ============ Options bar (context of the current tool/view) ============ -->
  <div class="optionsbar" id="optionsBar"></div>

  <main class="workspace" id="main">
    <!-- ============ Glyph overview ============ -->
    <section class="view view-grid" id="gridView">
      <aside class="panel side" aria-label="Filters">
        <div class="panel-head" data-i18n="categories"></div>
        <div class="panel-body">
          <nav class="cat-list" id="catList"></nav>
          <div class="sub-head" data-i18n="colors"></div>
          <div class="color-filter" id="colorFilter"></div>
          <div id="smartFilters"></div>
          <div class="sub-head" data-i18n="progressTitle"></div>
          <div class="progress" id="progress">
            <div class="progress-bar"><div id="progressFill"></div></div>
            <div class="progress-label" id="progressLabel"></div>
          </div>
        </div>
        <div class="side-metrics" id="sideMetrics"></div>
        <!-- Filled only on a hosted website (spline --web --site-dir) -->
        <div class="side-slot" id="sideSlot"><!--site:sidebar--></div>
      </aside>

      <div class="center">
        <div class="dock-top" data-zone="top"></div>
        <div class="center-row">
          <aside class="dock dock-left" data-zone="left"></aside>
          <div class="grid-wrap" id="gridWrap">
            <div class="glyph-grid" id="glyphGrid" role="listbox" aria-multiselectable="true" tabindex="0"></div>
          </div>
          <div class="dock-icons" data-zone="icons"></div>
        </div>
      </div>

      <aside class="dock" id="inspector"></aside>
    </section>

    <!-- ============ Kerning ============ -->
    <section class="view view-kern" id="kernView" hidden>
      <div class="center">
        <div class="dock-top" data-zone="top"></div>
        <div class="center-row">
          <aside class="dock dock-left" data-zone="left"></aside>
          <div class="canvas-wrap"><canvas id="kernCanvas" tabindex="0" role="img" aria-label="Kerning"></canvas></div>
          <div class="dock-icons" data-zone="icons"></div>
        </div>
      </div>
      <aside class="dock" id="kernPanel"></aside>
    </section>

    <!-- ============ Glyph editor ============ -->
    <section class="view view-editor" id="editorView" hidden>
      <nav class="toolstrip" id="toolbar" aria-label="Tools">
        <button class="tool" id="backBtn" type="button" data-i18n-title="back"><i data-icon="grid" data-size="18"></i></button>
        <div class="tool-sep"></div>
        <div id="toolButtons" role="radiogroup" aria-label="Tools"></div>
      </nav>

      <div class="center">
        <div class="dock-top" data-zone="top"></div>
        <div class="center-row">
          <aside class="dock dock-left" data-zone="left"></aside>
          <div class="canvas-wrap">
            <canvas id="canvas" tabindex="0" role="img"></canvas>
          </div>
          <div class="dock-icons" data-zone="icons"></div>
        </div>
      </div>

      <aside class="dock" id="glyphPanel"></aside>
    </section>
  </main>

  <!-- ============ Preview ============ -->
  <section class="preview" id="preview" aria-labelledby="previewTitle">
    <div class="preview-head">
      <button class="collapse" id="previewToggle" type="button" aria-expanded="true" aria-controls="previewBody">
        <i data-icon="chevronDown" data-size="14"></i><span id="previewTitle" data-i18n="preview"></span>
      </button>
      <input id="previewInput" spellcheck="false" aria-labelledby="previewTitle">
      <button class="btn ext-only" id="previewCurrent" type="button" data-i18n="previewCurrent" data-i18n-title="previewCurrentTip"></button>
      <label class="preview-size"><span data-i18n="previewSize"></span>
        <input type="range" id="previewSize" min="12" max="160" value="48"><output id="previewSizeOut">48</output>
      </label>
    </div>
    <div class="preview-body" id="previewBody">
      <div class="preview-feats" id="previewFeats" hidden></div>
      <div class="preview-out" id="previewOut"></div>
      <p class="preview-msg" id="previewMsg"></p>
    </div>
  </section>

  <!-- Panels torn off the right dock -->
  <div class="float-layer" id="floatLayer"></div>

  <!-- ============ Status bar ============ -->
  <footer class="statusbar">
    <span id="statusTip" aria-live="polite"></span>
    <span class="status-right">
      <span id="statusPos" class="mono"></span>
      <span id="statusZoom" class="mono"></span>
      <span id="statusInfo"></span>
      <button type="button" class="update-badge" id="updateBadge" hidden></button>
    </span>
  </footer>

  <div class="drop-overlay" id="dropOverlay" hidden><div><i data-icon="open" data-size="40"></i><p data-i18n="dropHere"></p></div></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite" popover="manual"></div>
  <dialog class="dialog" id="dialog"></dialog>
  <div class="tooltip" id="tooltip" role="tooltip" popover="manual" hidden></div>
</body>
</html>
