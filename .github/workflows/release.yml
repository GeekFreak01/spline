name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags and commits, for the release notes
      - uses: actions/setup-go@v5
        with:
          # The newest supported Go (security fixes in the standard library);
          # go.mod only states the oldest Go the code builds with.
          go-version: stable
          check-latest: true
      - run: go test ./...
      - name: Build binaries
        run: |
          mkdir dist
          build() {
            # Windows builds are GUI apps: no console window behind the editor.
            gui=""; [ "$1" = windows ] && gui="-H=windowsgui"
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath \
              -ldflags "-s -w $gui -X main.version=${GITHUB_REF_NAME}" -o "dist/$3" .
          }
          build windows amd64 spline-windows-amd64.exe
          build windows arm64 spline-windows-arm64.exe
          build darwin  arm64 spline-macos-arm64
          build darwin  amd64 spline-macos-amd64
          build linux   amd64 spline-linux-amd64
          build linux   arm64 spline-linux-arm64
      # What changed since the previous version, from the commit messages:
      # visible on the release page and in the update window of the app.
      - name: Release notes
        run: bash .github/scripts/release-notes.sh "${GITHUB_REF_NAME}" > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist/*
            notes.md

  # Windows installer (Inno Setup): asks for the install folder, adds Start
  # menu / desktop shortcuts, .sp file association and an uninstaller.
  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest supported Go (security fixes in the standard library);
          # go.mod only states the oldest Go the code builds with.
          go-version: stable
          check-latest: true
      - name: Build spline.exe
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.version=${GITHUB_REF_NAME}" -o dist/spline.exe .
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "${env:ProgramFiles}*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $iscc = (Get-ChildItem "${env:ProgramFiles}*\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName
          & $iscc /Q "/DAppVersion=$version" installer\spline.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/Spline-Setup-*.exe

  # A draft: nobody sees it, and no copy of Spline offers it, until it is
  # checked and published by hand. Then the update reaches everyone.
  draft:
    needs: [build, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv artifacts/notes.md notes.md
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          gh release create "${GITHUB_REF_NAME}" artifacts/* --draft --verify-tag \
            --title "${GITHUB_REF_NAME}" --notes-file notes.md --generate-notes
