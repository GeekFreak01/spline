name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build binaries
        run: |
          mkdir dist
          build() {
            # Windows builds are GUI apps: no console window behind the editor.
            gui=""; [ "$1" = windows ] && gui="-H=windowsgui"
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath \
              -ldflags "-s -w $gui -X main.version=${GITHUB_REF_NAME}" -o "dist/$3" .
          }
          build windows amd64 spline-windows-amd64.exe
          build windows arm64 spline-windows-arm64.exe
          build darwin  arm64 spline-macos-arm64
          build darwin  amd64 spline-macos-amd64
          build linux   amd64 spline-linux-amd64
          build linux   arm64 spline-linux-arm64
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Windows installer (Inno Setup): asks for the install folder, adds Start
  # menu / desktop shortcuts, .sp file association and an uninstaller.
  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build spline.exe
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.version=${GITHUB_REF_NAME}" -o dist/spline.exe .
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer\spline.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Spline-Setup-*.exe
