name: CI
on:
  push:
    branches: [main]
  pull_request:
# Pull requests from forks run here too, so the token can only read.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest supported Go (security fixes in the standard library);
          # go.mod only states the oldest Go the code builds with.
          go-version: stable
          check-latest: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      # The Windows and macOS files (app window, font install, registry)
      # are checked on every push, not only when a release is built.
      - name: Vet and build for Windows and macOS
        run: |
          for os in windows darwin; do
            CGO_ENABLED=0 GOOS=$os go vet ./...
            CGO_ENABLED=0 GOOS=$os GOARCH=amd64 go build -o /dev/null .
            CGO_ENABLED=0 GOOS=$os GOARCH=arm64 go build -o /dev/null .
          done
      - name: Check JavaScript syntax
        run: for f in web/js/*.js; do cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || exit 1; done
